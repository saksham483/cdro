<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDRO - Audit Logs</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>Auth.requireAuth();</script>
</head>
<body>
  <header class="top-header">
    <div class="brand-section">
      <div class="brand-logo">DR</div>
      <div class="brand-title">CDRO Orchestrator</div>
    </div>
    <nav class="main-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="backups.html">Backups</a>
      <a href="recoveries.html">Disaster Events</a>
      <a href="logs.html" class="active">Audit Logs</a>
    </nav>
    <div class="header-status-section">
      <div class="user-badge" id="header-user-display"></div>
    </div>
  </header>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
      <div>
        <h2 style="font-size: 1.4rem; font-weight: 700;">Immutable Audit Trail</h2>
        <p style="color: var(--text-secondary); font-size: 0.8rem;">Real-time logging of state changes, probes, backup verification, and recovery executions.</p>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <select id="severity-filter" class="form-control" style="width: 140px; padding: 0.4rem;" onchange="fetchLogs()">
          <option value="">All Severities</option>
          <option value="CRITICAL">CRITICAL</option>
          <option value="ERROR">ERROR</option>
          <option value="WARNING">WARNING</option>
          <option value="SUCCESS">SUCCESS</option>
          <option value="INFO">INFO</option>
        </select>
        <button class="btn btn-secondary" onclick="fetchLogs()">Refresh</button>
      </div>
    </div>

    <div class="table-container">
      <table class="ops-table">
        <thead>
          <tr>
            <th>Log ID</th>
            <th>Timestamp</th>
            <th>Severity</th>
            <th>Event Type</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="logs-tbody">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading audit logs...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/logs.js"></script>
</body>
</html>
