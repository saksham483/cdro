<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CDRO Console</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="brand-logo" style="margin: 0 auto; width: 42px; height: 42px; font-size: 20px;">DR</div>
      <h1>CDRO Console</h1>
      <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.35rem;">
        Automatic Failure Detection, Backup and Disaster Recovery
      </p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="admin or operator" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.65rem;">
        Authenticate to Console
      </button>
    </form>

    <div class="quick-roles-card">
      <p style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem; font-weight: 600;">
        DEMO ACCOUNTS (One-Click Fill):
      </p>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary" style="flex: 1; font-size: 0.75rem;" onclick="fillLogin('admin', 'admin123')">
          Fill Admin
        </button>
        <button type="button" class="btn btn-secondary" style="flex: 1; font-size: 0.75rem;" onclick="fillLogin('operator', 'operator123')">
          Fill Operator
        </button>
      </div>
    </div>
  </div>

  <script>
    function fillLogin(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          Auth.setAuth(data.access_token, data.user);
          window.location.href = 'dashboard.html';
        } else {
          alert('Login failed: ' + (data.message || 'Invalid credentials'));
        }
      } catch (err) {
        alert('Network error connecting to CDRO backend: ' + err.message);
      }
    });
  </script>
</body>
</html>
